    <iframe sandbox="allow-scripts" referrerpolicy="no-referrer" title="Gloam project board" srcdoc="&lt;div id=&quot;gloam-project-board&quot;&gt;
  &lt;style&gt;
    #gloam-project-board {
      --gpb-bg: light-dark(#f3f4f7, #0c1018);
      --gpb-panel: light-dark(#ffffff, #141a25);
      --gpb-panel-2: light-dark(#f8f9fb, #1a2230);
      --gpb-text: light-dark(#172033, #edf1f8);
      --gpb-muted: light-dark(#667085, #9ba8ba);
      --gpb-line: light-dark(#d9dee8, #2b3647);
      --gpb-primary: light-dark(#5d3fd3, #a790ff);
      --gpb-primary-soft: light-dark(#eeeaff, #2a2449);
      --gpb-now: light-dark(#b54708, #ffbd7a);
      --gpb-next: light-dark(#175cd3, #82b4ff);
      --gpb-parallel: light-dark(#067647, #67d9a4);
      --gpb-later: light-dark(#6941c6, #b59cff);
      --gpb-complete: light-dark(#475467, #b7c0cf);
      color-scheme: light dark;
      color: var(--gpb-text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      background: transparent;
    }
    #gloam-project-board * { box-sizing: border-box; }
    #gloam-project-board button,
    #gloam-project-board select { font: inherit; }
    #gloam-project-board .gpb-shell {
      background: var(--gpb-bg);
      border: 1px solid var(--gpb-line);
      border-radius: 14px;
      overflow: hidden;
    }
    #gloam-project-board .gpb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      background: var(--gpb-panel);
      border-bottom: 1px solid var(--gpb-line);
    }
    #gloam-project-board .gpb-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    #gloam-project-board .gpb-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      color: var(--gpb-primary);
      background: var(--gpb-primary-soft);
      flex: 0 0 auto;
    }
    #gloam-project-board .gpb-brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 500;
    }
    #gloam-project-board .gpb-brand p,
    #gloam-project-board .gpb-meta {
      margin: 2px 0 0;
      color: var(--gpb-muted);
      font-size: 12px;
      line-height: 1.35;
    }
    #gloam-project-board .gpb-health {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gpb-parallel);
      font-size: 12px;
      white-space: nowrap;
    }
    #gloam-project-board .gpb-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    #gloam-project-board .gpb-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px 12px;
      background: var(--gpb-panel);
      border-bottom: 1px solid var(--gpb-line);
    }
    #gloam-project-board .gpb-tab {
      border: 0;
      border-radius: 7px;
      padding: 8px 11px;
      color: var(--gpb-muted);
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
    }
    #gloam-project-board .gpb-tab[aria-selected=&quot;true&quot;] {
      color: var(--gpb-text);
      background: var(--gpb-primary-soft);
    }
    #gloam-project-board .gpb-panel { padding: 16px; }
    #gloam-project-board .gpb-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    #gloam-project-board .gpb-toolbar-copy h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
    }
    #gloam-project-board .gpb-toolbar-copy p {
      margin: 3px 0 0;
      color: var(--gpb-muted);
      font-size: 12px;
    }
    #gloam-project-board .gpb-filter {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gpb-muted);
      font-size: 12px;
    }
    #gloam-project-board .gpb-filter select {
      min-height: 36px;
      color: var(--gpb-text);
      background: var(--gpb-panel);
      border: 1px solid var(--gpb-line);
      border-radius: 7px;
      padding: 6px 30px 6px 9px;
    }
    #gloam-project-board .gpb-board-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 14px;
      align-items: start;
    }
    #gloam-project-board .gpb-lanes {
      display: grid;
      grid-template-columns: repeat(5, minmax(130px, 1fr));
      gap: 10px;
      align-items: start;
    }
    #gloam-project-board .gpb-lane { min-width: 0; }
    #gloam-project-board .gpb-lane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 2px 8px;
      color: var(--gpb-muted);
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    #gloam-project-board .gpb-count {
      display: inline-grid;
      place-items: center;
      min-width: 22px;
      height: 22px;
      border-radius: 11px;
      background: var(--gpb-panel-2);
      color: var(--gpb-muted);
    }
    #gloam-project-board .gpb-stack { display: grid; gap: 8px; }
    #gloam-project-board .gpb-task {
      width: 100%;
      text-align: left;
      color: var(--gpb-text);
      background: var(--gpb-panel);
      border: 1px solid var(--gpb-line);
      border-left: 3px solid var(--task-color, var(--gpb-line));
      border-radius: 9px;
      padding: 10px;
      cursor: pointer;
    }
    #gloam-project-board .gpb-task[aria-pressed=&quot;true&quot;] {
      border-color: var(--gpb-primary);
      border-left-color: var(--task-color, var(--gpb-primary));
      box-shadow: 0 0 0 2px var(--gpb-primary-soft);
    }
    #gloam-project-board .gpb-task-category {
      color: var(--gpb-muted);
      font-size: 11px;
      line-height: 1.25;
    }
    #gloam-project-board .gpb-task-title {
      margin-top: 5px;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 500;
    }
    #gloam-project-board .gpb-task-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 9px;
      margin-top: 9px;
      color: var(--gpb-muted);
      font-size: 11px;
    }
    #gloam-project-board .gpb-detail {
      position: sticky;
      top: 8px;
      background: var(--gpb-panel);
      border: 1px solid var(--gpb-line);
      border-radius: 10px;
      padding: 14px;
    }
    #gloam-project-board .gpb-detail h3 {
      margin: 6px 0 4px;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 500;
    }
    #gloam-project-board .gpb-detail p {
      margin: 0 0 13px;
      color: var(--gpb-muted);
      font-size: 12px;
      line-height: 1.5;
    }
    #gloam-project-board .gpb-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 13px;
    }
    #gloam-project-board .gpb-label {
      color: var(--gpb-muted);
      font-size: 11px;
    }
    #gloam-project-board .gpb-value {
      margin-top: 2px;
      font-size: 12px;
      line-height: 1.35;
    }
    #gloam-project-board .gpb-evidence {
      padding-top: 12px;
      border-top: 1px solid var(--gpb-line);
    }
    #gloam-project-board .gpb-discuss {
      width: 100%;
      min-height: 38px;
      margin-top: 13px;
      border: 0;
      border-radius: 8px;
      color: light-dark(#ffffff, #101521);
      background: var(--gpb-primary);
      cursor: pointer;
      font-weight: 500;
    }
    #gloam-project-board .gpb-flow {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 20px;
      align-items: stretch;
      margin-top: 16px;
    }
    #gloam-project-board .gpb-phase {
      position: relative;
      min-height: 138px;
      padding: 14px;
      border-radius: 10px;
      background: var(--gpb-panel);
      border: 1px solid var(--gpb-line);
    }
    #gloam-project-board .gpb-phase:not(:last-child)::after {
      content: &quot;→&quot;;
      position: absolute;
      right: -18px;
      top: 50%;
      color: var(--gpb-muted);
      transform: translateY(-50%);
    }
    #gloam-project-board .gpb-phase strong {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 500;
    }
    #gloam-project-board .gpb-phase p {
      margin: 0;
      color: var(--gpb-muted);
      font-size: 12px;
      line-height: 1.45;
    }
    #gloam-project-board .gpb-timeline,
    #gloam-project-board .gpb-source-list { display: grid; gap: 9px; margin-top: 14px; }
    #gloam-project-board .gpb-decision,
    #gloam-project-board .gpb-source {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--gpb-line);
    }
    #gloam-project-board .gpb-decision:last-child,
    #gloam-project-board .gpb-source:last-child { border-bottom: 0; }
    #gloam-project-board .gpb-decision time,
    #gloam-project-board .gpb-source-code { color: var(--gpb-muted); font-size: 12px; }
    #gloam-project-board .gpb-decision strong,
    #gloam-project-board .gpb-source strong { display: block; font-size: 13px; font-weight: 500; }
    #gloam-project-board .gpb-decision p,
    #gloam-project-board .gpb-source p { margin: 3px 0 0; color: var(--gpb-muted); font-size: 12px; line-height: 1.45; }
    #gloam-project-board .gpb-empty { color: var(--gpb-muted); font-size: 12px; padding: 12px 2px; }
    #gloam-project-board [hidden] { display: none !important; }
    @media (max-width: 900px) {
      #gloam-project-board .gpb-board-layout { grid-template-columns: 1fr; }
      #gloam-project-board .gpb-detail { position: static; }
      #gloam-project-board .gpb-lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #gloam-project-board .gpb-flow { grid-template-columns: 1fr; gap: 20px; }
      #gloam-project-board .gpb-phase { min-height: auto; }
      #gloam-project-board .gpb-phase:not(:last-child)::after { content: &quot;↓&quot;; right: 14px; top: auto; bottom: -17px; transform: none; }
    }
    @media (max-width: 520px) {
      #gloam-project-board .gpb-header,
      #gloam-project-board .gpb-toolbar { align-items: flex-start; flex-direction: column; }
      #gloam-project-board .gpb-panel { padding: 12px; }
      #gloam-project-board .gpb-lanes { grid-template-columns: 1fr; }
      #gloam-project-board .gpb-filter { width: 100%; justify-content: space-between; }
      #gloam-project-board .gpb-filter select { flex: 1; }
      #gloam-project-board .gpb-decision,
      #gloam-project-board .gpb-source { grid-template-columns: 1fr; gap: 4px; }
    }
    @media (pointer: coarse) {
      #gloam-project-board .gpb-tab,
      #gloam-project-board .gpb-filter select,
      #gloam-project-board .gpb-discuss { min-height: 44px; }
    }
  &lt;/style&gt;

  &lt;section class=&quot;gpb-shell&quot; aria-label=&quot;Gloam project planning dashboard&quot;&gt;
    &lt;header class=&quot;gpb-header&quot;&gt;
      &lt;div class=&quot;gpb-brand&quot;&gt;
        &lt;div class=&quot;gpb-mark&quot;&gt;&lt;i data-lucide=&quot;moon-star&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;
        &lt;div&gt;
          &lt;h1&gt;Gloam project board&lt;/h1&gt;
          &lt;p&gt;Lower Court · original 3D stealth-action prototype&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;gpb-health&quot;&gt;&lt;span class=&quot;gpb-dot&quot;&gt;&lt;/span&gt;Whole-body fluidity follow-up: smooth action and start/stop handoffs, punch recovery and moving jump gather. Native reset open; R14 candidate, V1 default.&lt;/div&gt;
    &lt;/header&gt;

    &lt;nav class=&quot;gpb-nav&quot; role=&quot;tablist&quot; aria-label=&quot;Project views&quot;&gt;
      &lt;button class=&quot;gpb-tab&quot; id=&quot;gpb-tab-board&quot; type=&quot;button&quot; role=&quot;tab&quot; data-panel=&quot;board&quot; aria-controls=&quot;gpb-panel-board&quot; aria-selected=&quot;true&quot;&gt;Board&lt;/button&gt;
      &lt;button class=&quot;gpb-tab&quot; id=&quot;gpb-tab-dependencies&quot; type=&quot;button&quot; role=&quot;tab&quot; data-panel=&quot;dependencies&quot; aria-controls=&quot;gpb-panel-dependencies&quot; aria-selected=&quot;false&quot;&gt;Dependencies&lt;/button&gt;
      &lt;button class=&quot;gpb-tab&quot; id=&quot;gpb-tab-decisions&quot; type=&quot;button&quot; role=&quot;tab&quot; data-panel=&quot;decisions&quot; aria-controls=&quot;gpb-panel-decisions&quot; aria-selected=&quot;false&quot;&gt;Decisions&lt;/button&gt;
      &lt;button class=&quot;gpb-tab&quot; id=&quot;gpb-tab-context&quot; type=&quot;button&quot; role=&quot;tab&quot; data-panel=&quot;context&quot; aria-controls=&quot;gpb-panel-context&quot; aria-selected=&quot;false&quot;&gt;Context structure&lt;/button&gt;
    &lt;/nav&gt;

    &lt;section class=&quot;gpb-panel&quot; id=&quot;gpb-panel-board&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;gpb-tab-board&quot; data-view=&quot;board&quot;&gt;
      &lt;div class=&quot;gpb-toolbar&quot;&gt;
        &lt;div class=&quot;gpb-toolbar-copy&quot;&gt;
          &lt;h2&gt;Upcoming work&lt;/h2&gt;
          &lt;p&gt;Task status and dependencies are generated from the current roadmap&lt;/p&gt;
        &lt;/div&gt;
        &lt;label class=&quot;gpb-filter&quot;&gt;Area
          &lt;select id=&quot;gpb-area-filter&quot;&gt;
            &lt;option value=&quot;all&quot;&gt;All areas&lt;/option&gt;
            &lt;option value=&quot;Characters&quot;&gt;Characters&lt;/option&gt;
            &lt;option value=&quot;Animation&quot;&gt;Animation&lt;/option&gt;
            &lt;option value=&quot;Movement&quot;&gt;Movement&lt;/option&gt;
            &lt;option value=&quot;Gameplay&quot;&gt;Gameplay&lt;/option&gt;
            &lt;option value=&quot;Level design&quot;&gt;Level design&lt;/option&gt;
            &lt;option value=&quot;Project&quot;&gt;Project&lt;/option&gt;
          &lt;/select&gt;

      &lt;/div&gt;

        &lt;aside class=&quot;gpb-detail&quot; id=&quot;gpb-detail&quot; aria-live=&quot;polite&quot;&gt;&lt;/aside&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;gpb-panel&quot; id=&quot;gpb-panel-dependencies&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;gpb-tab-dependencies&quot; data-view=&quot;dependencies&quot; hidden&gt;
      &lt;div class=&quot;gpb-toolbar-copy&quot;&gt;
        &lt;h2&gt;Safe execution order&lt;/h2&gt;
        &lt;p&gt;Current dependency and ownership records&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;gpb-flow&quot; aria-label=&quot;Task dependencies&quot;&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Whole-body fluidity · user review&lt;/strong&gt;&lt;p&gt;waiting · User whole-body naturalness and held movement judgement&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Swept haircut and fade · user review&lt;/strong&gt;&lt;p&gt;waiting · User accepts the rebuilt silhouette and clean-shaven face&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Relaxed crouch arms · user review&lt;/strong&gt;&lt;p&gt;waiting · User crouch silhouette and movement judgement&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Jump elbow direction · user review&lt;/strong&gt;&lt;p&gt;waiting · User corrected running-jump and landing judgement&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Action presentation · user action review&lt;/strong&gt;&lt;p&gt;waiting · User movement and paired takedown judgement&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;First Gloam Vigil runtime baseline&lt;/strong&gt;&lt;p&gt;complete · None; board UI tracked separately&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;R14 face/hair candidate · user visual judgement&lt;/strong&gt;&lt;p&gt;waiting · User accepts gameplay-scale appearance and motion&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;R14 corrected gait · user held-movement review&lt;/strong&gt;&lt;p&gt;waiting · User held movement and action feel&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Historical R14 paired performance certificate&lt;/strong&gt;&lt;p&gt;complete · Repeat only for a material performance question after changes&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Release R14 after user acceptance&lt;/strong&gt;&lt;p&gt;waiting · User appearance, held movement and paired takedown acceptance&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Guard health label updates during stun&lt;/strong&gt;&lt;p&gt;complete · None; board UI tracked separately&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Review the intended W/S direction convention&lt;/strong&gt;&lt;p&gt;later · Confirm desired camera-relative forward/back convention&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Animation polish and action variants&lt;/strong&gt;&lt;p&gt;complete · Verified crouch and jump/vault dimensions&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Riven Lantern Ward isolated gray-box&lt;/strong&gt;&lt;p&gt;complete · Verified crouch and jump/vault movement envelope&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Choose Riven integration shape&lt;/strong&gt;&lt;p&gt;waiting · Animation-polish and isolated Riven evidence accepted&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Reproducible reviews and source preservation&lt;/strong&gt;&lt;p&gt;complete · Rerun scenario after relevant changes&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gpb-phase&quot;&gt;&lt;strong&gt;Local board · rendered UI verification&lt;/strong&gt;&lt;p&gt;waiting · Permitted local browser access or user manual review&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;gpb-panel&quot; id=&quot;gpb-panel-decisions&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;gpb-tab-decisions&quot; data-view=&quot;decisions&quot; hidden&gt;
      &lt;div class=&quot;gpb-toolbar-copy&quot;&gt;
        &lt;h2&gt;Durable decisions&lt;/h2&gt;
